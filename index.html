<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Sealed Dashboard</title>
<style>
  :root { --bg:#14161a; --card:#1e2128; --text:#e8eaed; --muted:#9aa0a8; --accent:#f2b705; --ok:#3ecf8e; --warn:#ff8a4c; --line:#2d313a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, Segoe UI, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin:0 0 4px; font-size: 1.6rem; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:20px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .box h2 { margin:0 0 8px; font-size:1rem; color:var(--accent); }
  .box ul { margin:0; padding-left:20px; }
  .warn { border-color: var(--warn); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; font:inherit; }
  button.on { background:var(--accent); color:#14161a; border-color:var(--accent); }
  .item { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--muted); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .item.neu { border-left-color: var(--accent); }
  .item.schnaeppchen { border-left-color: var(--ok); }
  .item.fall { border-left-color: var(--warn); }
  .row { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .title { font-weight:600; }
  .price { font-weight:700; color:var(--accent); white-space:nowrap; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:4px; }
  .tag { display:inline-block; font-size:.75rem; padding:1px 8px; border-radius:999px; border:1px solid var(--line); margin-right:6px; }
  .tag.no { color:var(--warn); border-color:var(--warn); }
  .tag.yes { color:var(--ok); border-color:var(--ok); }
  a { color:#8ab4f8; }
  .empty { color:var(--muted); text-align:center; padding:24px; }
</style>
</head>
<body>
<main>
  <h1>Pokémon Sealed Dashboard</h1>
  <div class="sub" id="stand"></div>

  <div class="box warn"><h2>Wichtig</h2><div id="hinweis"></div></div>
  <div class="box"><h2>Meine Alarm-Regeln</h2><ul id="regeln"></ul></div>

  <div class="filters" id="filters"></div>
  <div id="liste"></div>
</main>

<script src="data.js"></script>
<script>
  const D = window.DASHBOARD || { funde: [], regeln: [] };
  document.getElementById('stand').textContent = 'Zuletzt aktualisiert: ' + (D.aktualisiert || 'unbekannt');
  document.getElementById('hinweis').textContent = D.hinweis || '';
  const regeln = document.getElementById('regeln');
  (D.regeln || []).forEach(r => { const li = document.createElement('li'); li.textContent = r; regeln.appendChild(li); });

  const kategorien = ['Alle', ...new Set((D.funde || []).map(f => f.kategorie))];
  let aktiv = 'Alle';
  const filters = document.getElementById('filters');
  const liste = document.getElementById('liste');

  function zeichneFilter() {
    filters.innerHTML = '';
    kategorien.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      if (k === aktiv) b.className = 'on';
      b.onclick = () => { aktiv = k; zeichneFilter(); zeichneListe(); };
      filters.appendChild(b);
    });
  }

  function zeichneListe() {
    liste.innerHTML = '';
    const funde = (D.funde || []).filter(f => aktiv === 'Alle' || f.kategorie === aktiv);
    if (!funde.length) { liste.innerHTML = '<div class="empty">Keine Einträge.</div>'; return; }
    funde.forEach(f => {
      const el = document.createElement('div');
      el.className = 'item ' + (f.alarm === 'schnaeppchen' ? 'schnaeppchen' : f.alarm === 'fall' ? 'fall' : f.alarm === 'neu' ? 'neu' : '');
      const a = f.link ? '<a href="' + f.link + '" target="_blank" rel="noopener">Quelle</a>' : '';
      el.innerHTML =
        '<div class="row"><div class="title"></div><div class="price"></div></div>' +
        '<div class="meta"></div><div class="meta notiz"></div>';
      el.querySelector('.title').textContent = f.titel;
      el.querySelector('.price').textContent = f.preis || '';
      el.querySelector('.meta').innerHTML =
        '<span class="tag ' + (f.geprueft ? 'yes' : 'no') + '">' + (f.geprueft ? 'geprüft' : 'ungeprüft') + '</span>' +
        '<span class="tag"></span> ' + a;
      el.querySelector('.meta .tag:nth-of-type(2)').textContent = f.kategorie + ' · ' + f.datum;
      el.querySelector('.notiz').textContent = [f.status, f.notiz].filter(Boolean).join(' – ');
      liste.appendChild(el);
    });
  }
  zeichneFilter(); zeichneListe();
</script>
</body>
</html>
